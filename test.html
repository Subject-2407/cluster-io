<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Socket.IO Chat Tester</title>
  <script src="http://localhost:3000/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; }
    #chatBox { border: 1px solid #ccc; height: 280px; overflow-y: auto; padding: 10px; margin: 10px 0; background: #fafafa; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; }
    input, select, button { padding: 6px 10px; }
    input[type="text"] { flex: 1; }
    #status { font-size: 12px; color: #555; }
  </style>
</head>
<body>
  <h3>Tester Express + Socket.IO Chat</h3>
  <div id="status">Status: Menghubungkan...</div>

  <div class="row">
    <input id="username" type="text" placeholder="Username (coba duplikat di 2 tab)" />
    <select id="colorSelect"></select>
    <button onclick="joinChat()">Join</button>
  </div>

  <div id="chatBox"></div>

  <div class="row">
    <input id="message" type="text" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter') sendMessage()" />
    <button onclick="sendMessage()">Kirim</button>
    <button onclick="clearChat()">Reset Server</button>
  </div>

  <script>
    const socket = io('http://localhost:3000');
    let currentUser = null;

    const chatBox = document.getElementById('chatBox');
    const statusEl = document.getElementById('status');
    const colorSelect = document.getElementById('colorSelect');

    // 1. Fetch opsi warna dari REST endpoint GET /api/colors
    fetch('http://localhost:3000/api/colors')
      .then(res => res.json())
      .then(res => {
        res.data.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.hex;
          opt.textContent = `${c.name} (${c.hex})`;
          colorSelect.appendChild(opt);
        });
      });

    function appendMessage(msg) {
      const div = document.createElement('div');
      div.style.color = msg.color;
      div.style.marginBottom = '4px';
      div.innerHTML = `<strong>${msg.username} <small>#${msg.shortId}</small>:</strong> ${msg.message}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 2. Listener event dari server
    socket.on('connect', () => {
      statusEl.textContent = `Terhubung (Socket ID: ${socket.id})`;
    });

    socket.on('history', (messages) => {
      chatBox.innerHTML = '';
      messages.forEach(appendMessage);
    });

    socket.on('message', (msg) => {
      appendMessage(msg);
    });

    socket.on('clear', () => {
      chatBox.innerHTML = '<em>--- Chat dibersihkan ---</em>';
    });

    // 3. Emit event 'join' dengan Acknowledgement
    function joinChat() {
      const username = document.getElementById('username').value;
      const color = colorSelect.value;

      socket.emit('join', { username, color }, (res) => {
        if (!res.success) {
          alert('Error Join: ' + res.error);
          return;
        }
        currentUser = res.data;
        statusEl.textContent = `Login sebagai ${currentUser.username} #${currentUser.shortId} (${currentUser.color})`;
      });
    }

    // 4. Emit event 'chat' dengan Acknowledgement
    function sendMessage() {
      const username = document.getElementById('username').value;
      const message = document.getElementById('message').value;
      const color = colorSelect.value;

      socket.emit('chat', {
        userId: currentUser ? currentUser.userId : null,
        username,
        message,
        color
      }, (res) => {
        if (!res.success) {
          alert('Validasi Ditolak: ' + res.error);
          return;
        }
        document.getElementById('message').value = '';
      });
    }

    function clearChat() {
      fetch('http://localhost:3000/api/messages', { method: 'DELETE' });
    }
  </script>
</body>
</html>
